<g text-anchor="middle">
  <text x="1238" y="427" font-size="11.5" font-weight="bold" fill="#0f6f6a">Self-Attention</text>
  <text x="1238" y="442" font-size="8">KV = 64 retrieved blocks</text>
  <text x="1238" y="454" font-size="8">+ question + generated tokens</text>
  <text x="1238" y="470" font-size="7.5" fill="#5c626b">≈ 12.5K tokens, contiguous RoPE</text>
  <text x="1238" y="482" font-size="7.5" fill="#5c626b">no local window, x28 layers</text>
</g>

<!-- the removed edge: local window is NOT attended at answer time -->
<line x1="1253" y1="184" x2="1253" y2="400" stroke="#b3b8bd" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ag)"/>
