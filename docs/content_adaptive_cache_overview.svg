  <rect x="24" y="578" width="10" height="10" rx="1" fill="#ffffff" stroke="#0f6f6a" stroke-width="0.9"/>
  <text x="40" y="587">GPU</text>
  <rect x="90" y="578" width="10" height="10" rx="1" fill="#f7f7f4" stroke="#5c626b" stroke-width="0.9" stroke-dasharray="2 1"/>
  <text x="106" y="587">CPU</text>
