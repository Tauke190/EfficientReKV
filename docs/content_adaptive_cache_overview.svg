<text x="592" y="445" font-size="8" font-family="Menlo, Consolas, monospace">retrieve_size = 64</text>
<text x="592" y="460" font-size="7.5" fill="#5c626b">span 64 frames at baseline,</text>
<text x="592" y="471" font-size="7.5" font-weight="bold" fill="#0f6f6a">291 frames at keep 0.22</text>

<line x1="470" y1="352" x2="470" y2="405" stroke="#3f5aa6" stroke-width="1.2" marker-end="url(#ai)"/>
