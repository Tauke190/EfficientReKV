<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 606" width="1400" height="606" role="img" aria-label="Overview of content-adaptive KV caching in two phases. Encode: StreamPrune emits a variable token count per frame, the stream is cut into 196-token blocks spanning a content-determined number of frames, each block is prefilled with attention over the GPU local window, and every block's KV is written to CPU. Answer: the question is scored against every block's representative key, the top 64 blocks are loaded into the GPU block cache, and answer-time self-attention uses only those retrieved blocks plus the question and generated tokens; the local window is not attended.">
<title>Content-Adaptive KV Caching — Overview</title>
<desc>Two phases. The encode phase runs for every frame: StreamPrune, a per-frame token-count bar chart, a token stream cut into blocks with their token ranges and frame spans, encode-time self-attention over the local window, and a write of every block to CPU. The answer phase runs once per question: scoring against representative keys, top-64 selection, loading into the GPU block cache, and self-attention over retrieved blocks, question and generated tokens only.</desc>

<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#16181c"/></marker>
  <marker id="ai" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#3f5aa6"/></marker>
  <marker id="at" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#0f6f6a"/></marker>
  <marker id="as" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#5c626b"/></marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.6 L10,5 L0,9.4 z" fill="#b3b8bd"/></marker>
  <pattern id="hx" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="6" height="6" fill="#f8f0da"/>
    <line x1="0" y1="0" x2="0" y2="6" stroke="#c79a3e" stroke-width="1.3"/>
  </pattern>
</defs>

