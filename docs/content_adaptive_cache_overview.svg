<!-- ============ ANSWER lane ============ -->
<rect x="30" y="408" width="160" height="70" rx="3" fill="#ffffff" stroke="#16181c" stroke-width="1.3"/>
<text x="42" y="430" font-size="12" font-weight="bold">Question</text>
<text x="42" y="446" font-size="8" font-family="Menlo, Consolas, monospace">ids (1, L_q)</text>
<text x="42" y="462" font-size="7.5" fill="#5c626b">arrives mid-stream</text>
<line x1="194" y1="443" x2="226" y2="443" stroke="#16181c" stroke-width="1.1" marker-end="url(#a)"/>

<rect x="230" y="408" width="310" height="70" rx="3" fill="#e6eaf7" stroke="#3f5aa6" stroke-width="1.3"/>
<text x="242" y="430" font-size="12" font-weight="bold" fill="#3f5aa6">Score every block</text>
<text x="242" y="448" font-size="8.5" font-family="Menlo, Consolas, monospace">s = block_k @ q.T      (n_blocks,)</text>
<text x="242" y="464" font-size="7.5" fill="#5c626b">one dot product per block — scans the whole video</text>
<line x1="544" y1="443" x2="576" y2="443" stroke="#3f5aa6" stroke-width="1.1" marker-end="url(#ai)"/>

<rect x="580" y="408" width="180" height="70" rx="3" fill="#e6eaf7" stroke="#3f5aa6" stroke-width="1.3"/>
