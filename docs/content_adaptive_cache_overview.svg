<text x="677" y="382" font-size="7.5" fill="#3f5aa6">select</text>
<line x1="930" y1="352" x2="930" y2="405" stroke="#3f5aa6" stroke-width="1.2" marker-end="url(#ai)"/>
<text x="937" y="382" font-size="7.5" fill="#3f5aa6">load 64 blocks</text>

<rect x="800" y="408" width="260" height="70" rx="3" fill="#ffffff" stroke="#0f6f6a" stroke-width="1.2"/>
