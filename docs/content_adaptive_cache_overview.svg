<text x="812" y="437" font-size="7.5" fill="#5c626b">128 slots, LRU; current top-64 pinned</text>
<g fill="#3f5aa6">
  <rect x="812" y="447" width="44" height="22" rx="1.5"/><rect x="862" y="447" width="44" height="22" rx="1.5"/>
  <rect x="912" y="447" width="44" height="22" rx="1.5"/><rect x="962" y="447" width="44" height="22" rx="1.5"/>
